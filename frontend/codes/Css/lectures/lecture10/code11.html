 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>Element Selector Type</title>
    <style>
      p{
        color:cornflowerblue;
        
      }
      h1{
        color:aquamarine;
      }
      .institute{
        color:burlywood;
      }
      .software{
        color:greenyellow;
      }
      .startup{
        color:coral;
      }
      #sports{
        color:palevioletred;
      }
   </style>
</head>
<body>
   <h1 class="institute"> Core2web</h1>
   <p>Know the code till the core</p>
   <h1 class="software">Incubators</h1>
   <p>we develop softwares</p>
   <h1 class="startup">Subscritpion</h1>
   <p>First startup backed by core2web</p>

   <h1 class="startup" id="sports">Playify</h1>
   <p>Second startup backed by Core2web</p>
</body>
</html>
